<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eduvance</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f1f7f7" />
    <script>
      /* Aplica tema e tamanho do texto antes da primeira pintura (sem "flash" de tela clara / texto que pula de tamanho). */
      (function () {
        var f = 100, t = 'auto';
        try {
          var j = JSON.parse(localStorage.getItem('eduvance:prefs') || 'null');
          if (j) { if ([85, 100, 115, 130, 150].indexOf(j.fonte) > -1) f = j.fonte; if (['claro', 'escuro', 'auto'].indexOf(j.tema) > -1) t = j.tema; }
          else { var o = localStorage.getItem('eduvance:tema'); if (o === 'dark') t = 'escuro'; else if (o === 'light') t = 'claro'; }
        } catch (e) {}
        var escuro = t === 'escuro' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        r.setAttribute('data-theme', escuro ? 'dark' : 'light');
        r.setAttribute('data-fonte', String(f));
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', escuro ? '#0c181b' : '#f1f7f7');
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/app.js"></script>
  </body>
</html>
